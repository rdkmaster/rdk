<html ng-app="myApp">

<head>

    <title>Graph Demo</title>

<body ng_controller="ctrl" >
    <div style="width:450px;">
        <p>极简应用</p>
        <rdk_graph data="temperatureOption"></rdk_graph>
    </div>
    <div style="width:450px;">
        <p>简单场景</p>
        <rdk_graph data="ds_temperature" ds="ds_temperature" ds_url="/demo/mock_data/graph/temperature" ds_query_if="ready" graph_context="this" graph_template="graph_define/simple_line.js"></rdk_graph>
    </div>
    <div style="width:450px;">
        <p>典型场景1</p>
        <rdk_graph data="ds_temperature" ds="ds_temperature" ds_url="/demo/mock_data/graph/temperature" ds_query_if="ready" graph_context="this" graph_template="graph_define/simple_line.js"></rdk_graph>
    </div>
    <div style="width:450px;">
        <p>典型场景2</p>
        <rdk_graph data="ds_temperature" ds="ds_temperature" ds_url="/demo/mock_data/graph/temperature" ds_query_if="ready" graph_context="this" graph_template="graph_define/simple_line.js"></rdk_graph>
    </div>
    <div style="width:450px;">
        <p>一个非常复杂的例子，来自真实业务的场景</p>
        <rdk_graph data="ds_temperature" ds="ds_temperature" ds_url="/demo/mock_data/graph/temperature" ds_query_if="ready" graph_context="this" graph_template="graph_define/simple_line.js"></rdk_graph>
    </div>
